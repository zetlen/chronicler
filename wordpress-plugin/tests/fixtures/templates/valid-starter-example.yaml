# A character-sheet template, shown here for Monster of the Week.
# The editor suggests keys and values as you type (Ctrl-Space asks for
# suggestions anywhere), and explains any key when you hover it.
system: Monster of the Week
version: 1

properties:
  # The five rolled ratings. A negative min renders values signed (+2 / -1),
  # and "detail" is the note shown under the stat — characters may override it.
  - id: charm
    label: Charm
    type: number
    min: -1
    max: 3
    detail: "manipulate someone"
  - id: cool
    label: Cool
    type: number
    min: -1
    max: 3
    detail: "act under pressure, help out"
  - id: sharp
    label: Sharp
    type: number
    min: -1
    max: 3
    detail: "investigate a mystery, read a bad situation"
  - id: tough
    label: Tough
    type: number
    min: -1
    max: 3
    detail: "kick some ass, protect someone"
  - id: weird
    label: Weird
    type: number
    min: -1
    max: 3
    detail: "use magic, big magic"

  # A track renders as fillable boxes. "live: true" lets players change it
  # from the play surfaces, not just wp-admin.
  - id: harm
    label: Harm
    type: track
    length: 7
    live: true
  - id: luck
    label: Luck
    type: track
    length: 7
    live: true

  # Conditions marked and cleared at the table are plain toggles. Taking
  # 4-harm or more makes a hunter unstable, and stabilizing — an event, not
  # a harm level — clears it, so current Harm can't tell you whether they
  # still are. Doomed (a doom drawing near, per the Keeper) is the same
  # shape. A `derived` formula fits conditions that ARE a pure function of
  # current values (a D&D-style ability modifier, say).
  - id: unstable
    label: Unstable
    type: toggle
  - id: doomed
    label: Doomed
    type: toggle

  # Exactly one choice from options.
  - id: hunter_type
    label: Hunter Type
    type: select
    options:
      - { id: chosen, label: The Chosen }
      - { id: expert, label: The Expert }
      - { id: flake, label: The Flake }
      - { id: monstrous, label: The Monstrous }
      - { id: mundane, label: The Mundane }

  # Any subset of options, each checked on or off. A formula can ask about one
  # option — moves["nine_lives"] is 1 when checked, 0 when not — so a derived
  # value can depend on whether a move is taken.
  - id: moves
    label: Moves
    type: checklist
    options:
      - { id: the_big_entrance, label: The Big Entrance }
      - { id: nine_lives, label: Nine Lives }
      - { id: crime_pays, label: Crime Pays }
      - { id: read_about_this, label: I've Read About This Sort of Thing }

  # A repeatable list; each entry gets these fields. "when" gates a field
  # behind an expression over the entry's other fields — a bare toggle id
  # is the common case. Playtest-honed conventions (#181): call the free-text
  # field "Description" (not "Effect"), and give EVERY entry a tags field —
  # only truly weapon-specific fields (like Harm) belong behind the toggle.
  - id: gear
    label: Gear
    type: list
    entry_label: Item
    fields:
      - id: name
        label: Name
        type: text
      - id: description
        label: Description
        type: longtext
      - id: tags
        label: Tags
        type: text
      - id: is_weapon
        label: Weapon?
        type: toggle
      - id: harm_rating
        label: Harm
        type: number
        min: 0
        max: 5
        when: is_weapon
      # A dice field makes an entry a roll the character carries: write
      # "1d8" or "2d6 + {tough}" on a weapon and /game roll offers it,
      # named after the entry. Gate it on the toggle so only real weapons
      # contribute. A string that doesn't parse offers no roll and breaks
      # nothing — the sheet editor flags it.
      # A dice FIELD can carry traits too, and they ride every roll its
      # entries contribute: tag the field once and every weapon on every
      # sheet is an "attack", so "-1 to attacks while your arm is broken" is
      # one effect (see effects: below) instead of one per item.
      - id: roll
        label: Roll
        type: dice
        when: is_weapon
        traits: { attack: true }

  # always_show keeps an empty property visible as a prompt instead of
  # hiding the blank row. Audience flags: none is public; owner_only shows
  # solely to the owning player and game masters (player-private notes);
  # gm_only renders solely for game masters.
  - id: player_notes
    label: Player Notes
    type: longtext
    always_show: true
    owner_only: true
  - id: gm_notes
    label: GM Notes
    type: longtext
    gm_only: true

layout:
  # Ordered sections of property ids. A masthead section renders inside the
  # header card; anything never placed lands in a trailing "Other" section.
  # Each section also has an id — the name it is addressed by. Leave it out
  # and it derives from the heading ("Moves & Gear" becomes moves_gear); give
  # one, as Ratings does below, when you want a different word to work.
  - section: Hunter
    masthead: true
    properties: [hunter_type]
  - id: stats
    section: Ratings
    properties: [charm, cool, sharp, tough, weird]
  - section: Status
    properties: [harm, luck, unstable, doomed]
  - section: Moves & Gear
    properties: [moves, gear]

rolls:
  # The rolls this system offers, each addressed by its id (/game roll
  # act_under_pressure) or its label. Dice notation covers the random part —
  # 2d6, 4d6kh3 to keep the highest three, 2d20kh1 for advantage — and
  # anything between braces is a formula in the same language as `derived`,
  # evaluated against this character and added as a number. "section" is
  # optional grouping for the listing; rolls without one list last.
  # These are the rolls EVERY character of this system has. A roll only one
  # character has — a playbook move that rolls +Sharp instead of +Cool, a
  # weapon's damage — doesn't belong here: the character carries it, as dice
  # written on their own list entry (see gear's "roll" field above).
  #
  # "traits" is the one open corner of a roll: scalars YOU name, saying what
  # KIND of roll this is. Nothing in the plugin knows what "basic_move" means
  # — you invent the word, and the effects below target every roll wearing it
  # instead of listing rolls one at a time. Custom names live under this one
  # key precisely so the rest of the roll can stay closed: a typo'd "sectoin:"
  # is still an error, which is how it should be.
  - id: act_under_pressure
    label: Act Under Pressure
    section: Basic Moves
    dice: "2d6 + {cool}"
    traits: { basic_move: true }
    detail: "when you act under pressure"
  - id: kick_some_ass
    label: Kick Some Ass
    section: Basic Moves
    dice: "2d6 + {tough}"
    traits: { basic_move: true }
    detail: "when you get into a fight"
  # Braces take a whole formula when a roll needs one — a homebrew
  # '2d6 + {weird + floor(luck["current"] / 2)}' would fold half your
  # remaining Luck in — but the book's Use Magic is flat +Weird, so here
  # the braces hold just the property.
  # The penalty a Keeper hangs on big magic — "you're at -1 to Use Magic
  # until you sleep it off" — used to be a house rule and somebody's memory.
  # It is an effect now (/game effect add wolf "Backlash" -1 use_magic), so
  # it prints inside the roll until somebody clears it.
  - id: use_magic
    label: Use Magic
    dice: "2d6 + {weird}"
    traits: { basic_move: true }
    detail: "when you work a ritual"

# The modifiers this system knows how to hand out. A template only declares
# the vocabulary; nothing lands on a character until a game master applies it
# (/game effect add wolf forward), and then it shows up as its own labeled,
# signed term in every roll it touches — `[5] [3] +1 (Forward) = 9`.
effects:
  # "+1 forward" is PbtA's own word for this: a bonus that rides your
  # next move, then clears. Nothing expires by itself — the modifier
  # prints on every roll it touches, so a stale one is caught at the
  # table, which is the lifecycle. The GM applies these: /game effect
  # add wolf forward.
  - id: forward
    label: Forward
    detail: "+1 to what you roll next; clear it once it lands"
    modifier: 1
    cap: 2                     # the cap is ours, not the book's: however many
                               # Forwards stack up, they stop adding at +2
  # "+1 ongoing" is also the book's word; the named conditions carrying
  # these next two are ours, invented to show targeting a trait and the
  # expression form.
  - id: ongoing_basics
    label: Steadied
    detail: "+1 ongoing to basic moves while the condition holds"
    applies_to: basic_move     # a truthy trait key targets a category
    modifier: 1
  # The expression form, for when sugar can't say it: this reads the
  # roll's flattened traits directly. amount scales it (apply at 2 for
  # a -2). A roll without the trait evaluates to 0 and stays clean.
  - id: terrified
    label: Terrified
    detail: "-1 to basic moves while the fear is in charge"
    modifier: "roll['basic_move'] ? -amount : 0"
    cap: -2
