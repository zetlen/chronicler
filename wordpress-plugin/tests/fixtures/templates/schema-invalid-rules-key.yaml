# rules was removed 2026-07-13 — the schema rejects it as an unknown key,
# and since the top-level allowlist (2026-07-25) the PHP parser refuses it
# too ('unknown key "rules". Did you mean "rolls"?').
system: Rules Are Gone
version: 1
properties:
  - id: harm
    label: Harm
    type: track
    length: 7
  - id: doomed
    label: Doomed
    type: toggle
rules:
  - when: { prop: harm, gte: 7 }
    set: { prop: doomed, value: true }
